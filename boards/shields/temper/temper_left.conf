# Deep sleep
CONFIG_ZMK_SLEEP=y

# Mouse move / scroll / click, used by the Miryoku Mouse and Button layers
CONFIG_ZMK_POINTING=y

# Report both halves' battery levels over BLE, so host-side tools such as
# zmk-battery-bar can read them. Already implied by ZMK_BLE, but explicit here.
CONFIG_ZMK_BATTERY_REPORTING=y
# Central-only: pull the peripheral's level over the split link and republish it
# as a second Battery Service. Both default to n. These have no effect in
# temper_right.conf, which is the peripheral.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
